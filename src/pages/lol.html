<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Artemisa Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'artemisa-pink': '#F472B6',
                        'artemisa-dark-pink': '#EC4899'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-100 font-sans">
    <div class="flex h-screen">
        <!-- Sidebar -->
        <div class="w-64 bg-artemisa-pink text-white flex flex-col">
            <!-- Navigation Items -->
            <nav class="flex-1 pt-8">
                <ul class="space-y-6 px-6">
                    <li><a href="#" class="block text-white text-lg font-medium hover:text-pink-100">Comunidad</a></li>
                    <li><a href="#" class="block text-white text-lg font-medium hover:text-pink-100">Eventos</a></li>
                    <li><a href="#" class="block text-white text-lg font-medium hover:text-pink-100">Apoyo</a></li>
                    <li><a href="#" class="block text-white text-lg font-medium hover:text-pink-100">Amigas</a></li>
                    <li><a href="#" class="block text-white text-lg font-medium hover:text-pink-100">Emprendimientos</a></li>
                </ul>
            </nav>
            
            <!-- User Profile at Bottom -->
            <div class="p-6 border-t border-pink-400">
                <div class="flex items-center space-x-3">
                    <div class="w-10 h-10 bg-gray-300 rounded-full"></div>
                    <span class="text-white font-medium">Nombre usuario</span>
                </div>
            </div>
        </div>

        <!-- Main Content -->
        <div class="flex-1 flex flex-col">
            <!-- Header -->
            <header class="bg-white shadow-sm border-b border-gray-200 px-8 py-4">
                <div class="flex items-center justify-between">
                    <h1 class="text-2xl font-bold text-artemisa-pink">ARTEMISA</h1>
                    <div class="flex-1 max-w-md mx-8">
                        <input 
                            type="text" 
                            placeholder="" 
                            class="w-full px-4 py-2 border border-gray-300 rounded-full focus:outline-none focus:ring-2 focus:ring-artemisa-pink focus:border-transparent"
                        >
                    </div>
                </div>
            </header>

            <!-- Main Dashboard Content -->
            <main class="flex-1 p-8 space-y-8">
                <!-- User Profile Section -->
                <section class="bg-white rounded-2xl shadow-sm border border-gray-200 p-6">
                    <article class="flex items-center space-x-4">
                        <div class="w-20 h-20 bg-gray-300 rounded-lg"></div>
                        <h2 class="text-xl font-semibold text-artemisa-pink">Nombre Usuario</h2>
                    </article>
                </section>

                <!-- Cards Section -->
                <section class="grid grid-cols-2 gap-6">
                    <!-- Logros Card -->
                    <article class="bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden">
                        <div class="p-6">
                            <h3 class="text-lg font-semibold text-artemisa-pink mb-4">Logros</h3>
                            <div class="h-64 bg-gray-50 rounded-lg"></div>
                        </div>
                    </article>

                    <!-- Metas Card -->
                    <article class="bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden">
                        <div class="p-6">
                            <h3 class="text-lg font-semibold text-artemisa-pink mb-4">Metas</h3>
                            <div class="h-64 bg-gray-50 rounded-lg"></div>
                        </div>
                    </article>
                </section>
            </main>


        </div>
    </div>
</body>
</html>
