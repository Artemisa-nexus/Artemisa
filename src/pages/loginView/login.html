<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/src/css/styles.css">
    <title>Login</title>
</head>

<body>
</head>
<body class="min-h-screen bg-[#fbf7fc] p-6">
    <!-- Back Button -->
    <button class="bg-[#f56d95] text-white px-6 py-2 rounded-full text-sm font-medium hover:bg-[#e55a87] transition-colors">
        Go Back
    </button>

    <!-- Main Content -->
    <main class="flex flex-col items-center justify-center min-h-[calc(100vh-120px)] max-w-md mx-auto">
        <!-- Flower Illustration -->
        <div class="mb-16">
            <img src="/public/assets/Icono.svg" alt="Decorative lily flower" class="w-32 h-32">
        </div>

        <!-- Login Form -->
        <form class="w-full space-y-8">
            <!-- Email Field -->
            <section class="space-y-3">
                <label for="email" class="block text-[#f56d95] text-base font-medium">Email</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    class="w-full px-4 py-4 bg-white border border-[#cbcbcb] rounded-lg focus:outline-none focus:border-[#f56d95] focus:ring-1 focus:ring-[#f56d95] transition-colors"
                    required
                >
            </section>

            <!-- Password Field -->
            <section class="space-y-3">
                <label for="password" class="block text-[#f56d95] text-base font-medium">Password</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    class="w-full px-4 py-4 bg-white border border-[#cbcbcb] rounded-lg focus:outline-none focus:border-[#f56d95] focus:ring-1 focus:ring-[#f56d95] transition-colors"
                    required
                >
            </section>

            <!-- Sign In Button -->
            <button 
                type="submit"
                class="w-full bg-[#f56d95] text-white py-4 rounded-full text-base font-medium hover:bg-[#e55a87] transition-colors mt-16"
            >
                Log in
            </button>
        </form>
    </main>
</body>

</html>
